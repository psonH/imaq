<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Imaq · Household water</title>
    <meta name="description" content="Know your household water: quality, how much is left, and how your home uses it." />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter for UI, Noto Sans Canadian Aboriginal so Inuktitut syllabics render on every device -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Canadian+Aboriginal:wght@400;600;700&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700&display=swap" rel="stylesheet" />
    <script>
      // Apply saved text size and language before paint (no flash).
      try {
        var s = JSON.parse(localStorage.getItem('imaq:prefs') || '{}');
        if (s.textSize) document.documentElement.dataset.text = s.textSize;
        if (s.lang) document.documentElement.lang = s.lang === 'iu' ? 'iu-Cans' : s.lang;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
